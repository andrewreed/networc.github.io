<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NETWORC</title>
  <meta name="description" content="NETWORC — dark electronic with electric guitars. New music coming soon." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    html,body{ height:100%; overflow:hidden; }

    body{
      background: #070809
        url("assets/networc-banner.png")
        center center / cover no-repeat;
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    /* Grain overlay */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:url("assets/grain.png") repeat;
      opacity:.07;
      mix-blend-mode:overlay;
      z-index:1;
    }

    /* Vignette / bottom fade so text reads clearly */
    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(ellipse at center, transparent 40%, #070809 100%),
        linear-gradient(to top, #070809 0%, transparent 50%);
      z-index:2;
    }

    a{
      position:relative;
      z-index:3;
      font-family:"UnifrakturCook", serif;
      font-weight:700;
      font-size:clamp(22px, 4vw, 36px);
      color:#e7e1d7;
      text-decoration:none;
      letter-spacing:3px;
      padding-bottom:clamp(60px, 12vh, 120px);
      animation:breathe 4s ease-in-out infinite;
      text-shadow:0 0 30px rgba(208,116,45,.3), 0 4px 20px rgba(0,0,0,.8);
      transition:color .3s ease;
    }

    a:hover{
      color:#d0742d;
    }

    @keyframes breathe{
      0%, 100%{ opacity:.4; }
      50%{ opacity:1; }
    }
  </style>
</head>

<body>
  <a href="https://x.com/networc_fm" target="_blank" rel="noreferrer">Lurking...</a>
</body>
</html>
